# Local stack: Kafka (KRaft, no ZooKeeper) + Kafka UI + ingest + analytics.
#   docker compose up -d --build
#   npm run simulate -- --orders 25
#   open http://localhost:8081/v1/stats/namaste-india-siegen   (stats)
#   open http://localhost:8090                                 (Kafka UI: topics, messages, consumer lag)
services:
  kafka:
    image: apache/kafka:4.1.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,INTERNAL://:19092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 20

  kafka-ui:
    image: kafbat/kafka-ui:latest
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092
    depends_on:
      kafka:
        condition: service_healthy

  ingest:
    build: { context: ., args: { SERVICE: ingest } }
    ports:
      - "8080:8080"
    environment:
      KAFKA_BROKERS: kafka:19092
      TENANTS: '{"namaste-india-siegen":"local-dev-secret-change-me"}'
      TOPIC_PARTITIONS: "2"
    depends_on:
      kafka:
        condition: service_healthy

  analytics:
    build: { context: ., args: { SERVICE: analytics } }
    ports:
      - "8081:8081"
    environment:
      KAFKA_BROKERS: kafka:19092
      ANALYTICS_DB: /data/analytics.sqlite
      CORS_ORIGIN: "*"
    volumes:
      - analytics-data:/data
    depends_on:
      - ingest

volumes:
  analytics-data:
